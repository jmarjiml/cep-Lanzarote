<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Cartelería · CEP Lanzarote</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { color: #fff; font-family: Arial, Helvetica, sans-serif; }
    #stage { position: fixed; inset: 0; background: #000; }
    .poster { position: absolute; width: 100%; height: 100%; left: 0; top: 0;
              object-fit: contain; opacity: 0; transition: opacity .8s ease-in-out; }
    .poster.active { opacity: 1; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: #071828; color: #eef5fb; text-align: center; padding: 28px;
              line-height: 1.5; z-index: 5; }
    #status.hidden { display: none; }
    #status p { font-size: clamp(19px, 2.3vw, 32px); margin: 12px 0; }
    #status small { color: #b9c8d5; font-size: clamp(13px, 1.3vw, 18px); }
    #hint { position: fixed; right: 16px; bottom: 12px; font-size: 12px;
            background: rgba(0,0,0,.65); border-radius: 7px; padding: 7px 10px;
            opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .poster { transition: none; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="Carteles de actividades con inscripción abierta">
    <img id="posterA" class="poster" alt="" referrerpolicy="no-referrer">
    <img id="posterB" class="poster" alt="" referrerpolicy="no-referrer">
  </main>
  <div id="status"><div><p>CEP LANZAROTE</p><p id="statusMessage">Cargando carteles con inscripción abierta…</p><small id="statusDetail">Conectando con la cartelera</small></div></div>
  <div id="hint"></div>
  <script>
    (function () {
      'use strict';
      var DURATION = 10000; // Cada cartel 10 segundos
      var REFRESH = 15 * 60 * 1000; // Consultar actualización cada 15 minutos
      var items = [], current = -1, activeImage = 0;
      var imgs = [document.getElementById('posterA'), document.getElementById('posterB')];
      var status = document.getElementById('status');
      var message = document.getElementById('statusMessage');
      var detail = document.getElementById('statusDetail');
      var timer;
      function valid(item) {
        if (!item || !item.image || !item.close) return false;
        var today = new Date();
        var y = today.getFullYear(), m = ('0' + (today.getMonth()+1)).slice(-2), d = ('0'+today.getDate()).slice(-2);
        // El calendario del televisor debe estar configurado correctamente.
        return item.close >= y+'-'+m+'-'+d;
      }
      function showStatus(m, d) {
        message.textContent = m;
        detail.textContent = d || '';
        status.className = '';
      }
      function next() {
        clearTimeout(timer);
        items = items.filter(valid);
        if (!items.length) {
          imgs[0].className = 'poster'; imgs[1].className = 'poster';
          showStatus('No hay carteles con plazo verificado y abierto', 'La pantalla se actualizará automáticamente.');
          return;
        }
        current = (current + 1) % items.length;
        var nextImage = 1 - activeImage;
        var target = imgs[nextImage];
        var item = items[current];
        target.onload = function () {
          target.className = 'poster active';
          imgs[activeImage].className = 'poster';
          activeImage = nextImage;
          status.className = 'hidden';
          timer = setTimeout(next, DURATION);
        };
        target.onerror = function () {
          target.onload = null;
          target.onerror = null;
          // No bloquear el ciclo ante imágenes que el proveedor retire.
          timer = setTimeout(next, 500);
        };
        target.alt = item.title || 'Cartel de una actividad';
        target.src = item.image;
      }
      function update() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'carteles.json?t=' + Date.now(), true);
        xhr.timeout = 20000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var data = JSON.parse(xhr.responseText);
              var updated = (data.entries || []).filter(valid);
              var oldKey = JSON.stringify(items);
              items = updated;
              if (oldKey !== JSON.stringify(items) || current === -1) {
                current = -1;
                next();
              }
            } catch (e) {
              if (!items.length) showStatus('No se pudo leer la cartelera', 'Comprobar conexión o actualización de GitHub Pages.');
            }
          } else if (!items.length) {
            showStatus('No se pudo cargar la cartelera', 'Comprobar la conexión a internet.');
          }
        };
        xhr.onerror = function () { if (!items.length) showStatus('Sin conexión a la cartelera', 'Se reintentará automáticamente.'); };
        xhr.ontimeout = xhr.onerror;
        xhr.send();
      }
      update();
      setInterval(update, REFRESH);
      // Rehacer el ciclo al volver a la pestaña tras suspensión del navegador.
      document.addEventListener('visibilitychange', function () { if (!document.hidden) update(); });
    }());
  </script>
</body>
</html>
